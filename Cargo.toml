[package]
name = "lily58-assistant"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Read-only on-screen companion for learning a Lily58 (Vial) keyboard"

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.2"
env_logger = "0.11.11"
evdev = "0.13.2"
libc = "0.2.189"
log = "0.4.34"
lzma-rs = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
